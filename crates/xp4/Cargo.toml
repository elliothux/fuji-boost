[package]
name = "fuji-boost-xp4"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
fujimod-emulator-xp4-board = { path = "../../references/fujimod/crates/emulator-xp4-board" }
fujimod-emulator-cpu = { path = "../../references/fujimod/crates/emulator-cpu" }
fujimod-emulator-cpu-unicorn = { path = "../../references/fujimod/crates/emulator-cpu-unicorn" }
fujimod-firmware = { path = "../../references/fujimod/crates/firmware" }
fujimod-recovery = { path = "../../references/fujimod/crates/recovery" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2.2"

flate2 = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 2
lto = "thin"
panic = "abort"
